<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="utf-8">
      <title>{{ page_title or "Dashboard"}}</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <script src="https://kit.fontawesome.com/cd3149d197.js" crossorigin="anonymous"></script>
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <!-- TODO: Make Hamburger actually extend with anchor tags -->
  <body class="bg-gray-100 font-sans antialiased">
    <header class="lg:hidden fixed top-4 right-4 z-50">
      <button
        class="bg-gray-800 text-white p-2 rounded-md shadow hover:bg-gray-700 transition"
        aria-label="Open menu"
      >
        <i class="fa-solid fa-bars text-lg"></i>
      </button>
    </header>
    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <aside class="hidden lg:block w-64 bg-gray-800 text-white p-6">
        <h1 class="text-2xl font-bold mb-8">🏠 PropManager</h1>
        <nav class="space-y-2">
          <a href="/" class="block px-3 py-2 rounded hover:bg-gray-700">Dashboard</a>
          <a href="/properties" class="block px-3 py-2 rounded hover:bg-gray-700">Properties</a>
          <a href="/tenants" class="block px-3 py-2 rounded hover:bg-gray-700">Tenants</a>
          <a href="/payments" class="block px-3 py-2 rounded hover:bg-gray-700">Payments</a>
          <a href="/settings" class="block px-3 py-2 rounded hover:bg-gray-700">Settings</a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 p-8">
        {% block content %}{% endblock %}
      </main>
    </div>
    {% block scripts %}{% endblock %}
  </body>
</html>
