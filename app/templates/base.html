<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>{{ page_title or "Dashboard"}}</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 font-sans antialiased">
    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <aside class="w-64 bg-gray-800 text-white p-6">
        <h1 class="text-2xl font-bold mb-8">🏠 PropManager</h1>
        <nav class="space-y-2">
          <a href="/" class="block px-3 py-2 rounded hover:bg-gray-700">Dashboard</a>
          <a href="/properties" class="block px-3 py-2 rounded hover:bg-gray-700">Properties</a>
          <a href="/tenants" class="block px-3 py-2 rounded hover:bg-gray-700">Tenants</a>
          <a href="/payments" class="block px-3 py-2 rounded hover:bg-gray-700">Payments</a>
          <a href="/settings" class="block px-3 py-2 rounded hover:bg-gray-700">Settings</a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 p-8">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
