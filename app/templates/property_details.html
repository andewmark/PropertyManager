{% extends "base.html" %}
{% block content %}
<script src="https://kit.fontawesome.com/cd3149d197.js" crossorigin="anonymous"></script>
<!--Top-->
<div class="flex items-center justify-between mb-6">
    <h2 class="text-3xl font-semibold text-gray-800">{{ page_title }}</h2>
</div>

<!--Overview Summary-->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
  <div class="bg-white p-6 rounded-2xl shadow">
    <h3 class="text-gray-500 text-sm uppercase mb-2">Units Occupied</h3>
    <p class="text-2xl font-bold text-blue-600">{{ occupied_units }}</p>
  </div>

  <div class="bg-white p-6 rounded-2xl shadow">
    <h3 class="text-gray-500 text-sm uppercase mb-2">Active Tenants</h3>
    <p class="text-2xl font-bold text-green-600">34</p>
  </div>

  <div class="bg-white p-6 rounded-2xl shadow">
    <h3 class="text-gray-500 text-sm uppercase mb-2">Outstanding Payments</h3>
    <p class="text-2xl font-bold text-red-600">$2,150</p>
  </div>
</div>

<!--Search Bar-->
<div class="relative w-80 mb-6">
    <input type="text" placeholder="Search..." class="px-4 py-2 w-full rounded-full focus:outline-none shadow">
    <button class="bg-blue-500 p-1 px-3 text-white absolute right-0 top-0 mt-1 mr-2 rounded-full hover:bg-blue-600">
        <i class="fa-solid fa-arrow-right"></i>
    </button>
</div>

<!--Units-->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <div class="bg-white rounded-2xl shadow hover:shadow-lg transition overflow-hidden relative">

    </div>
</div>
{% endblock %}
