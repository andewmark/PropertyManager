name: Lint with Ruff

on:
    pull_request:
        branches:
            - main
    push:
        branches-ignore:
            - main

jobs:
    ruff-lint:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout Code
                uses: actions/checkout@v4

            -   name: Set up Python
                uses: actions/setup-python@v5
                with:
                    python-version: '3.12.3'
                
            -   name: Install Ruff
                run: pip install ruff
                
            -   name: Run Ruff linter
                run: ruff check .
            
            -   name: Run Ruff formatter check
                run: ruff format --check .